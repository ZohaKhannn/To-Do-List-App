<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>
    <div class="app">
        <h1>To-Do List</h1>
<label class="switch">
  <input type="checkbox" id="themeToggle">
  <span class="track">
    <span class="cloud cloud-1"></span>
    <span class="cloud cloud-2"></span>
    <span class="star star-1"></span>
    <span class="star star-2"></span>
    <span class="star star-3"></span>
    <span class="star star-4"></span>
    <span class="star star-5"></span>
    <span class="handle">
      <span class="crater crater-1"></span>
      <span class="crater crater-2"></span>
      <span class="crater crater-3"></span>
    </span>
  </span>
</label>
        <div class="input-area">
            <input type="text" id="taskInput" placeholder="What need to be done?">
            <button id="addBtn">
  <svg class="btn-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle class="sun" cx="12" cy="8" r="3" stroke="white" stroke-width="1.5"/>
    <path class="mountain" d="M2 19L8 11L12 15L16 10L22 19H2Z" stroke="white" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
  </svg>
  <span>Add</span>
</button>
    </div>
    <ul id="taskList"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
